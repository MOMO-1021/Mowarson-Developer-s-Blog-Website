[build]
command = "npm run build"
publish = ".next"

# Instruct Netlify to use the Next.js Runtime for proper SSR/ISR support.
[[plugins]]
package = "@netlify/plugin-nextjs"

# Cache static Next.js assets for 1 year (they're content-hashed).
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Cache public assets (images, fonts, icons) for 7 days.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

# Cache sitemap and robots for 1 day.
[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=3600"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Cache-Control = "public, max-age=86400"
